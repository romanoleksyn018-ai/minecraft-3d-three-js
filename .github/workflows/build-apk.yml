name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: false
        default: 'debug'

jobs:
  build:
    name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Android SDK (вже є на ubuntu-latest, нічого не качаємо) ──
      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 ||           yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      # ── 4. Gradle ────────────────────────────────────────────
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-read-only: false

      # ── 5. Permissions ───────────────────────────────────────
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew 2>/dev/null || true

      # ── 6. Build Debug APK ───────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 7. Find & rename APK ─────────────────────────────────
      - name: Find built APK
        id: find_apk
        run: |
          APK_SRC=$(find android -name "*.apk" | head -1)
          if [ -z "$APK_SRC" ]; then echo "APK not found"; exit 1; fi
          APK_OUT="Minecraft-3D-—-Three.js-v1.0.0-run${{ github.run_number }}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "apk_path=$APK_OUT" >> $GITHUB_OUTPUT
          ls -lh "$APK_OUT"

      # ── 8. Upload APK artifact (login required, 30 днів) ─────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-3D-—-Three.js-debug-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # ── 9. Publish a GitHub Release with the APK attached ────
      #     (публічне посилання на завантаження, без логіну, не згорає)
      - name: Create Release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Minecraft 3D — Three.js v1.0.0 (build #${{ github.run_number }})"
          body: |
            Автоматична збірка з коміту ${{ github.sha }}.
            Встанови APK на телефоні: дозволь "Встановлення з невідомих джерел", якщо попросить.
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false

      # ── 10. Print summary ─────────────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| App | Minecraft 3D — Three.js |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | com.minecraft3dt.app |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | 1.0.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | 17 (Temurin) |" >> $GITHUB_STEP_SUMMARY
          echo "| Gradle | 8.4 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 APK у **Releases** (публічне посилання) і в **Artifacts** вище ↑" >> $GITHUB_STEP_SUMMARY